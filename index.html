<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>좋은 방식 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 줄 카드 → 넓은 화면은 두 줄. 묶음 버튼은 화면을 따라오지 않는다(작업 영역을 가리지 않게). */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141B24; --muted:#56606E; --line:#D9DEE6;
  --accent:#1F4FD1; --accent-soft:#E6EDFC; --star:#9A5B00; --star-soft:#FFF1D9;
  --prop:#5B3FB8; --prop-soft:#EEE9FB; --dont:#A3262C; --dont-soft:#FBE7E8;
  --font-display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#18202A; --ink:#EEF2F7; --muted:#A6B0BE; --line:#2C3644;
  --accent:#8FB0FF; --accent-soft:#1E2B48; --star:#FFC46B; --star-soft:#3A2A10;
  --prop:#C2B2FF; --prop-soft:#2B2346; --dont:#FF9DA1; --dont-soft:#3F1C1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --ink:#EEF2F7; --muted:#A6B0BE; --line:#2C3644;
  --accent:#8FB0FF; --accent-soft:#1E2B48; --star:#FFC46B; --star-soft:#3A2A10;
  --prop:#C2B2FF; --prop-soft:#2B2346; --dont:#FF9DA1; --dont-soft:#3F1C1F; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* 잠금 화면 */
.gate{min-height:80vh;display:grid;place-items:center}
.gate form{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;display:grid;gap:16px}
.gate h1{font-size:28px}
.gate p{margin:0;color:var(--muted)}
.gate label{font-weight:700}
.gate input{width:100%;font-size:22px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.gate input:focus{border-color:var(--accent);outline:none}
.btn{border:0;border-radius:12px;padding:14px 18px;font-size:20px;font-weight:700;background:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.6}
.err{color:var(--dont);font-weight:700;min-height:1.6em}

/* 머리 */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:30px;line-height:1.25}
.ver{color:var(--muted);font-size:16px;margin-top:4px}
.ghost{background:transparent;border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-size:16px;font-weight:700}

.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.count{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px}
.count b{display:block;font-family:var(--font-display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.count span{font-size:15px;color:var(--muted);font-weight:500}
.count.star b{color:var(--star)}

/* 묶음 버튼 */
.groups{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:17px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}
.tools input{flex:1 1 220px;min-width:0;font-size:18px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.kindf{border:2px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:16px;font-weight:700}
.kindf[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* 묶음 제목과 카드 */
.sec{margin-bottom:34px}
.sec h2{font-size:24px;padding-bottom:8px;border-bottom:3px solid var(--ink);margin-bottom:14px}
.sec h2 small{font-family:var(--font-body);font-size:16px;color:var(--muted);font-weight:500;margin-left:8px}
.cards{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:820px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.k-dont{border-left:5px solid var(--dont)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.liked{background:var(--star-soft);color:var(--star)}
.tag.rule{background:var(--accent-soft);color:var(--accent)}
.tag.proposal{background:var(--prop-soft);color:var(--prop)}
.tag.dont{background:var(--dont-soft);color:var(--dont)}
.card h3{font-size:22px;line-height:1.35}
.quote{margin:0;padding:10px 14px;border-left:4px solid var(--line);background:var(--bg);border-radius:0 10px 10px 0;font-size:17px}
.quote cite{display:block;font-style:normal;color:var(--muted);font-size:14px;margin-top:4px}
.fit{margin:0;font-size:17px;padding:8px 12px;border-radius:10px;background:var(--accent-soft)}
.fit b{color:var(--accent)}
.estonly{margin:0 0 30px;border-top:0;padding:0}
.estonly>summary{font-size:18px;color:var(--muted);padding:12px 0}
.why{margin:0;color:var(--muted);font-size:17px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{font-weight:700;color:var(--accent);cursor:pointer;padding:4px 0;font-size:17px}
ol{margin:8px 0 0;padding-left:1.4em;display:grid;gap:6px;font-size:17px}
.step1{margin:8px 0 0;font-size:17px}
.hist{font-size:15px;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);padding:20px 0}

/* 바뀐 내역 */
.changes{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.changes h2{font-size:22px;margin-bottom:10px}
.chg{padding:10px 0;border-top:1px solid var(--line)}
.chg:first-of-type{border-top:0}
.chg b{font-family:var(--font-display);font-size:18px}
.chg span{color:var(--muted);font-size:15px;margin-left:8px}
.chg ul{margin:6px 0 0;padding-left:1.2em;font-size:16px}
.foot{color:var(--muted);font-size:14px;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<section class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>좋은 방식 모음</h1>
    <p>같이 쓰는 작업 방식을 모아 둔 곳입니다. 받은 비밀번호를 넣어 주세요.</p>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password" required>
    <button class="btn" id="openBtn" type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<main id="app" hidden>
  <header class="top">
    <div>
      <h1>좋은 방식 모음</h1>
      <div class="ver" id="ver"></div>
    </div>
    <button class="ghost" id="lockBtn" type="button">잠그기</button>
  </header>

  <nav class="groups" id="groups" aria-label="묶음"></nav>
  <div class="tools">
    <input id="q" type="search" placeholder="찾기 (예: 레퍼런스, 화면)" aria-label="찾기">
  </div>
  <div id="list"></div>
  <p class="foot">내용을 더하거나 바꾸려면 Claude에게 말해 주세요. 바뀌면 이 주소에서 새로 고치면 보입니다.</p>
</main>

</div>
<script>
(() => {
  const GROUPS = [
    ["research","조사"],["plan","기획"],["team","함께 일하기"],["screen","화면"],["rules","작업 규칙"],["dont","피할 것"]];
  const S = crypto && crypto.subtle, te = new TextEncoder(), td = new TextDecoder();
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const $ = id => document.getElementById(id);
  let DATA = null, ENC = null, group = "all";

  async function openWith(pw) {
    const L = ENC.lock;
    const base = await S.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
    const wk = await S.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:unb64(L.salt), iterations:L.iter}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pk8 = await S.decrypt({name:"AES-GCM", iv:unb64(L.iv)}, wk, unb64(L.wrapped));   // 비밀번호가 틀리면 여기서 실패
    return pk8;
  }
  async function decryptWith(pk8) {
    const priv = await S.importKey("pkcs8", pk8, {name:"ECDH", namedCurve:"P-256"}, false, ["deriveBits"]);
    const epk = unb64(ENC.epk);
    const pub = await S.importKey("raw", epk, {name:"ECDH", namedCurve:"P-256"}, false, []);
    const shared = await S.deriveBits({name:"ECDH", public:pub}, priv, 256);
    const hk = await S.importKey("raw", shared, "HKDF", false, ["deriveKey"]);
    const key = await S.deriveKey({name:"HKDF", hash:"SHA-256", salt:epk, info:te.encode("good-methods-v1")}, hk, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await S.decrypt({name:"AES-GCM", iv:unb64(ENC.iv)}, key, unb64(ENC.ct));
    return JSON.parse(td.decode(plain));
  }
  const keep = pk8 => { try { sessionStorage.setItem("gm_k", btoa(String.fromCharCode(...new Uint8Array(pk8)))) } catch (e) {} };
  const kept = () => { try { const s = sessionStorage.getItem("gm_k"); return s ? unb64(s) : null } catch (e) { return null } };
  const forget = () => { try { sessionStorage.removeItem("gm_k") } catch (e) {} };

  async function load() {
    if (!S) { $("err").textContent = "이 브라우저에서는 열 수 없습니다. 크롬이나 사파리로 열어 주세요."; return; }
    try {
      const r = await fetch("data.enc.json?t=" + Date.now(), {cache:"no-store"});
      ENC = await r.json();
    } catch (e) { $("err").textContent = "내용을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로 고쳐 주세요."; return; }
    const k = kept();
    if (k) { try { show(await decryptWith(k)); return } catch (e) { forget() } }
    $("pw").focus();
  }

  $("gateForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    if (!ENC) return;
    const btn = $("openBtn"); btn.disabled = true; btn.textContent = "여는 중…"; $("err").textContent = "";
    try {
      const pk8 = await openWith($("pw").value);
      const d = await decryptWith(pk8); keep(pk8); $("pw").value = ""; show(d);
    } catch (e) { $("err").textContent = "비밀번호가 맞지 않습니다. 다시 넣어 주세요."; $("pw").select(); }
    btn.disabled = false; btn.textContent = "열기";
  });
  $("lockBtn").addEventListener("click", () => { forget(); DATA = null; $("list").textContent = ""; $("app").hidden = true; $("gate").hidden = false; $("pw").focus(); });

  function show(d) {
    DATA = d; $("gate").hidden = true; $("app").hidden = false;
    $("ver").textContent = d.ver + " · " + fmtDate(d.date) + " 기준";
    const live = d.methods;
    const g = $("groups"); g.innerHTML = "";
    [["all", "전체", live.length], ...GROUPS.map(([id, name]) => [id, name, live.filter(m => m.g === id).length])].forEach(([id, name, c]) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.dataset.g = id;
      b.textContent = name; const s = document.createElement("small"); s.textContent = c; b.append(s);
      b.addEventListener("click", () => { location.hash = id === "all" ? "" : id; route(); });
      g.append(b);
    });
    route();
  }
  function route() {
    const h = location.hash.replace("#", "");
    group = GROUPS.some(([id]) => id === h) ? h : "all";
    document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.g === group)));
    render();
  }
  window.addEventListener("hashchange", () => DATA && route());
  $("q").addEventListener("input", () => render());

  function fmtDate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? (+m[2]) + "월 " + (+m[3]) + "일" : (s || ""); }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render() {
    if (!DATA) return;
    const q = $("q").value.trim().toLowerCase();
    const list = $("list"); list.innerHTML = "";
    let shown = 0;
    GROUPS.forEach(([gid, gname]) => {
      if (group !== "all" && group !== gid) return;
      const items = DATA.methods.filter(m => m.g === gid)
        .filter(m => !q || [m.t, m.fit || "", m.why || "", (m.steps || []).join(" ")].join(" ").toLowerCase().includes(q))
        .sort((a, b) => (a.o || 0) - (b.o || 0));
      if (!items.length) return;
      shown += items.length;
      const sec = el("section", "sec"); sec.id = "sec-" + gid;
      const h = el("h2", null, gname); h.append(el("small", null, items.length + "개")); sec.append(h);
      const cards = el("div", "cards");
      items.forEach(m => cards.append(card(m)));
      sec.append(cards); list.append(sec);
    });
    if (!shown) list.append(el("p", "empty", "맞는 방식이 없습니다. 찾는 말이나 묶음을 바꿔 보세요."));
  }

  function card(m) {
    const c = el("article", "card" + (m.g === "dont" ? " k-dont" : ""));
    c.append(el("h3", null, m.t));
    if (m.fit) { const f = el("p", "fit"); f.append(el("b", null, "인스타에선 ")); f.append(document.createTextNode(m.fit)); c.append(f); }
    if (m.why) c.append(el("p", "why", m.why));
    if (m.steps && m.steps.length) {
      const d = el("details"); d.append(el("summary", null, m.steps.length > 1 ? "하는 순서 " + m.steps.length + "단계" : "하는 법"));
      if (m.steps.length > 1) { const ol = el("ol"); m.steps.forEach(x => ol.append(el("li", null, x))); d.append(ol); }
      else d.append(el("p", "step1", m.steps[0]));
      c.append(d);
    }
    return c;
  }

  load();
})();
</script>
</body>
</html>
